# Builds the desktop deliverables and publishes them as workflow artifacts. On
# a `v*` tag it also attaches them to a GitHub Release together with a
# `SHA256SUMS` file.
#
#   1. oskel-<platform>          - the development engine (`oskel`/`oskel.exe`)
#                                 installed next to the standard library
#                                 (`std/`), the layout `standardLibraryDir`
#                                 looks for, so `import std.math` resolves from
#                                 the unpacked archive. Linux x64, Windows x64,
#                                 macOS arm64 and macOS x64.
#   2. oskel-windows-x64-setup   - an Inno Setup installer that puts the engine
#                                 in `Program Files`, adds it to the system
#                                 PATH and optionally associates `.oskl` files.
#   3. oskel-linux-packages      - `.deb` and `.rpm` packages that install into
#                                 `/usr`, so `/usr/bin/oskel` finds
#                                 `/usr/share/oskel/std`.
#   4. oskel-macos-packages      - a `.pkg` installer and a `.dmg` disk image
#                                 that install into `/usr/local`.
#   5. oskel-vscode-extension    - the packaged VS Code extension (`.vsix`),
#                                 platform-independent, built once.
#
# This is separate from `cmake-multi-platform.yml`, which only builds and tests
# on three toolchains: this one's job is to publish runnable artifacts.
name: Artifacts and release

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# One run per ref: a new push cancels the previous, still-running build.
concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: oskel-linux-x64
            archive: oskel-linux-x64.tar.gz
          - os: windows-latest
            artifact: oskel-windows-x64
            archive: oskel-windows-x64.zip
          # `macos-latest` is the Apple Silicon image (macOS 26, arm64). The
          # dev engine is portable C++, so this builds natively; the native
          # backend stays x86-64 (see DEVELOPMENT.md PHASE 7).
          - os: macos-latest
            artifact: oskel-macos-arm64
            archive: oskel-macos-arm64.tar.gz
          # The Intel image runs the hosted AOT half of `cxxbind.skia` and
          # `oskel.build_hosted_sdl`, which the arm64 image can only skip.
          - os: macos-15-intel
            artifact: oskel-macos-x64
            archive: oskel-macos-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux UI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev pkg-config autoconf automake libtool \
            autoconf-archive zip unzip

      - name: Cache bundled UI dependencies
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-ui-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/prepare_ui_deps.py', 'cmake/triplets/**') }}
          restore-keys: |
            vcpkg-ui-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare bundled UI dependencies
        # Builds shared SDL3 and static Skia into .vcpkg, then exports the two
        # install prefixes through CMAKE_PREFIX_PATH. The release archive must
        # not ask the user to install either library.
        shell: bash
        run: |
          PYTHON=${{ matrix.os == 'windows-latest' && 'python' || 'python3' }}
          "$PYTHON" tools/prepare_ui_deps.py \
            --vcpkg-root .vcpkg \
            --cache .vcpkg-cache \
            --github-env "$GITHUB_ENV"

      - name: Configure CMake
        # The default generator is Visual Studio on Windows (multi-config) and
        # Unix Makefiles / Ninja elsewhere (single-config); the configuration
        # is chosen at build/install time with --config either way. CMake reads
        # the CMAKE_PREFIX_PATH exported by the dependency step.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -S .

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        # The FFI callback and struct-by-value tests are excluded by the build
        # when their capability is missing (see CMakeLists.txt). The UI and
        # SDL3 end-to-end tests run on every x86-64 job, including the Intel
        # macOS runner; arm64 macOS runs their VM half only.
        working-directory: build
        run: ctest --build-config Release --output-on-failure

      - name: Install into a staging prefix
        # `cmake --install` produces the same layout as `make install`:
        # stage/bin/oskel, stage/bin/oskelc, stage/bin/oskelld,
        # stage/bin/oskelp, stage/bin/bindgen and stage/bin/oskelint plus
        # stage/share/oskel/std/*.oskl. The engine finds the library through
        # `../share/oskel/std` relative to the executable, so the staged tree is
        # self-contained and runs after unpacking.
        run: cmake --install build --config Release --prefix stage

      - name: Determine the version
        id: version
        shell: bash
        # One source of truth for every package name: the tag being released,
        # or `project(... VERSION x.y.z)` on a branch push or pull request.
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^project([^ ]* VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)"
          fi
          if [ -z "$version" ]; then
            echo "could not determine the version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging Oskel $version"

      - name: Package the engine (Unix)
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.archive }}" -C stage .

      - name: Package the engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path stage\* -DestinationPath "${{ matrix.archive }}"

      - name: Upload the engine
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        # Inno Setup ships on the Windows image, but its directory is not on
        # PATH and the version in the path changes with the image, so it is
        # located rather than hard-coded.
        run: |
          $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
                   Select-Object -First 1).FullName
          if (-not $iscc) { throw "ISCC.exe not found; the Windows image no longer ships Inno Setup" }

          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DStageDir=$PWD\stage" "packaging\windows\oskel.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          Get-Item dist\oskel-windows-x64-setup.exe | Format-List Name, Length

      - name: Upload the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: oskel-windows-x64-setup
          path: dist/oskel-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Build the Linux packages
        if: runner.os == 'Linux'
        # `dpkg-deb` is on the image; the script installs `rpmbuild` on demand
        # and skips the `.rpm` rather than failing if it cannot.
        run: bash packaging/linux/package-linux.sh "${{ steps.version.outputs.version }}" stage dist

      - name: Upload the Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: oskel-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          retention-days: 30

      - name: Build the macOS packages
        # One installer per architecture; the Intel job proves the AOT tests
        # and publishes an archive, not a second `.pkg`/`.dmg` with the same
        # name as the arm64 one.
        if: runner.os == 'macOS' && matrix.artifact == 'oskel-macos-arm64'
        # `pkgbuild`/`productbuild`/`hdiutil` come with the Xcode command-line
        # tools on the image. The `.pkg` is unsigned.
        run: bash packaging/macos/package-macos.sh "${{ steps.version.outputs.version }}" stage dist

      - name: Upload the macOS packages
        if: runner.os == 'macOS' && matrix.artifact == 'oskel-macos-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: oskel-macos-packages
          path: |
            dist/*.pkg
            dist/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node.js
        # `@vscode/vsce` needs a modern Node; pin it so the extension packaging
        # does not depend on the runner's preinstalled version. The extension
        # is platform-independent, so it is packaged on one runner only.
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package the VS Code extension
        if: matrix.os == 'ubuntu-latest'
        working-directory: editors/vscode
        # `--out` pins the file name so the upload and the release assets do not
        # depend on the extension version in package.json.
        run: npx --yes @vscode/vsce@3 package --out oskel-vscode.vsix

      - name: Upload the VS Code extension
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: oskel-vscode-extension
          path: editors/vscode/oskel-vscode.vsix
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    # Only a `v*` tag publishes; branch pushes and pull requests stop at the
    # artifacts above.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download every artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        # One checksum line per release asset, in the `sha256sum -c` format, so
        # `cd dist && sha256sum -c SHA256SUMS` verifies a download. Sorted for a
        # stable file across runs.
        run: |
          sha256sum $(ls -1 | grep -v '^SHA256SUMS$' | sort) > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # `gh release create` fails with "a release with the same tag name
        # already exists" when the release was created in the UI before the
        # tag was pushed. Create it only when missing, then upload (or replace)
        # the assets, so the step is idempotent either way. `--generate-notes`
        # writes the changelog from the commits since the previous tag; `--repo`
        # lets both commands run without a checkout.
        #
        # An existing release is edited before the upload: the UI marks a
        # hand-made release "pre-release" by default, and reusing it verbatim
        # published a final `v0.2.0` that GitHub hid from the "Latest" slot.
        # The tag is the only thing that decides the version, so the release is
        # normalised from the tag: a tag carrying a `-` (`v0.2.0-rc1`) is a
        # pre-release and must stay one, every other tag is a final release.
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            PRE_RELEASE=true
            LATEST=false
          else
            PRE_RELEASE=false
            LATEST=true
          fi
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --prerelease="${PRE_RELEASE}" \
              --latest="${LATEST}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --prerelease="${PRE_RELEASE}" \
              --latest="${LATEST}" \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            dist/*
